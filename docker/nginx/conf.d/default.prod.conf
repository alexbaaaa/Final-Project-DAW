server {
    listen 80;
    listen [::]:80;

    server_name swimmingup.hopto.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name swimmingup.hopto.org;

    ssl_certificate /etc/letsencrypt/live/swimmingup.hopto.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swimmingup.hopto.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $frontend_upstream frontend:80;
    set $wordpress_upstream wordpress:80;
    
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /admin;
    }

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /blog {
        return 301 /blog/;
    }

    location = /blog/wp-admin {
        return 301 /blog/wp-admin/;
    }

    location ^~ /blog/ {
        rewrite ^/blog/?(.*)$ /$1 break;

        proxy_pass http://$wordpress_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /blog;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
