name: swimming-up

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    container_name: swimmingup_nginx
    depends_on:
      - frontend
      - backend
      - wordpress
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - public
      - internal

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: swimmingup_frontend
    restart: unless-stopped
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    container_name: swimmingup_backend
    depends_on:
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Swimming Up}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_DOMAIN: ${APP_DOMAIN:-swimmingup.hopto.org}
      APP_URL: ${APP_URL:-http://swimmingup.hopto.org/admin}
      ASSET_URL: ${ASSET_URL:-http://swimmingup.hopto.org/admin}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-swimmingup.hopto.org}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      CACHE_STORE: ${CACHE_STORE:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      DB_CONNECTION: ${LARAVEL_DB_CONNECTION:-mariadb}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${MARIADB_DATABASE}
      DB_USERNAME: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      AUTH_DB_HOST: postgres
      AUTH_DB_PORT: 5432
      AUTH_DB_DATABASE: ${POSTGRES_DB}
      AUTH_DB_USERNAME: ${POSTGRES_USER}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: swimmingup_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atc \"SELECT 1\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal

  mariadb:
    image: mariadb:11.4
    container_name: swimmingup_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -u\"$${MARIADB_USER}\" -p\"$${MARIADB_PASSWORD}\" \"$${MARIADB_DATABASE}\" -e \"SELECT 1\" >/dev/null && mariadb -h 127.0.0.1 -u\"$${WORDPRESS_DB_USER}\" -p\"$${WORDPRESS_DB_PASSWORD}\" \"$${WORDPRESS_DB_NAME}\" -e \"SELECT 1\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal

  wordpress:
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
    container_name: swimmingup_wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WP_HOME: ${WP_HOME:-http://swimmingup.hopto.org/blog}
      WP_SITEURL: ${WP_SITEURL:-http://swimmingup.hopto.org/blog}
      WP_CONTENT_URL: ${WP_CONTENT_URL:-http://swimmingup.hopto.org/blog/wp-content}
      WORDPRESS_CONFIG_EXTRA: |
          define('WP_HOME', getenv('WP_HOME') ?: 'http://swimmingup.hopto.org/blog');
          define('WP_SITEURL', getenv('WP_SITEURL') ?: 'http://swimmingup.hopto.org/blog');
          define('WP_CONTENT_URL', getenv('WP_CONTENT_URL') ?: 'http://swimmingup.hopto.org/blog/wp-content');

          define('COOKIEPATH', '/blog/');
          define('SITECOOKIEPATH', '/blog/');
          define('ADMIN_COOKIE_PATH', '/blog/wp-admin');

          if (isset($$_SERVER['HTTP_X_FORWARDED_PREFIX'])) {
              $$_SERVER['REQUEST_URI'] = $$_SERVER['HTTP_X_FORWARDED_PREFIX'] . $$_SERVER['REQUEST_URI'];
          }
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content/themes/swimmingup:/var/www/html/wp-content/themes/swimmingup:ro
      - wordpress_uploads:/var/www/html/wp-content/uploads
    restart: unless-stopped
    networks:
      - internal

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: swimmingup_phpmyadmin
    profiles:
      - debug
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:-http://localhost:8081/}
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT:-64M}
    restart: unless-stopped
    networks:
      - internal

networks:
  public:
    name: swimmingup_public
  internal:
    name: swimmingup_internal
    internal: true

volumes:
  postgres_data:
  mariadb_data:
  wordpress_data:
  wordpress_uploads:
