name: swimming-up

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: swimmingup_nginx
    depends_on:
      - frontend
      - backend
      - wordpress
      - phpmyadmin
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - public
      - internal

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: swimmingup_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: swimmingup_backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DOMAIN: ${APP_DOMAIN:-swimmingup}
      APP_URL: ${APP_URL:-http://swimmingup/admin}
      ASSET_URL: ${ASSET_URL:-http://swimmingup/admin}
      DB_CONNECTION: ${LARAVEL_DB_CONNECTION:-mariadb}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${MARIADB_DATABASE}
      DB_USERNAME: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      AUTH_DB_HOST: postgres
      AUTH_DB_PORT: 5432
      AUTH_DB_DATABASE: ${POSTGRES_DB}
      AUTH_DB_USERNAME: ${POSTGRES_USER}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - mariadb
      - postgres
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: swimmingup_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal

  mariadb:
    image: mariadb:11.4
    container_name: swimmingup_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal

  wordpress:
    ports:
    - "8081:80"
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
    container_name: swimmingup_wordpress
    depends_on:
      - mariadb
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
          define('WP_HOME', 'http://swimmingup/blog');
          define('WP_SITEURL', 'http://swimmingup/blog');
          define('WP_CONTENT_URL', 'http://swimmingup/blog/wp-content');

          define('COOKIEPATH', '/blog/');
          define('SITECOOKIEPATH', '/blog/');
          define('ADMIN_COOKIE_PATH', '/blog/wp-admin');

          if (isset($$_SERVER['HTTP_X_FORWARDED_PREFIX'])) {
              $$_SERVER['REQUEST_URI'] = $$_SERVER['HTTP_X_FORWARDED_PREFIX'] . $$_SERVER['REQUEST_URI'];
          }
    volumes:
      - ./wordpress/wp-content:/var/www/html/wp-content
      - wordpress_data:/var/www/html
    networks:
      - internal

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: swimmingup_phpmyadmin
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: http://swimmingup/phpmyadmin/
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT:-64M}
    networks:
      - internal

networks:
  public:
    name: swimmingup_public
  internal:
    name: swimmingup_internal

volumes:
  postgres_data:
  mariadb_data:
  wordpress_data:
  frontend_node_modules:
